<h3>Alumnos</h3>
<div class="example-container mat-elevation-z8">
    <div class="example-table-container">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

            <ng-container matColumnDef="nif_nie">
                <th mat-header-cell *matHeaderCellDef>
                    <input matInput [formControl]="nifFilter" placeholder="NIF/NIE">
                    <span mat-sort-header></span>
                </th>
                <td mat-cell *matCellDef="let a"> {{a.nif_nie}} </td>
            </ng-container>

            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef>
                    <input matInput [formControl]="nombreFilter" placeholder="Nombre">
                    <span mat-sort-header></span>
                </th>
                <td mat-cell *matCellDef="let a"> {{a.nombre}} </td>
            </ng-container>

            <ng-container matColumnDef="apellidos">
                <th mat-header-cell *matHeaderCellDef>
                    <input matInput [formControl]="apellidosFilter" placeholder="Apellidos">
                    <span mat-sort-header></span>
                </th>
                <td mat-cell *matCellDef="let a"> {{a.apellidos}} </td>
            </ng-container>

            <ng-container matColumnDef="ciclo">
                <th mat-header-cell *matHeaderCellDef>
                    <input matInput [formControl]="cicloFilter" placeholder="Ciclo">
                    <span mat-sort-header></span>
                </th>
                <td mat-cell *matCellDef="let a"> {{a.ciclo_nombre}} </td>
            </ng-container>

            <ng-container matColumnDef="curso">
                <th mat-header-cell *matHeaderCellDef>
                    <input matInput [formControl]="cursoFilter" placeholder="Curso">
                    <span mat-sort-header></span>
                </th>
                <td mat-cell *matCellDef="let a"> {{a.curso}}º </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef>
                    <button mat-icon-button (click)="openDialog()">
                        <mat-icon>add_circle</mat-icon>
                    </button>
                </th>
                <td mat-cell *matCellDef="let a">
                    <button mat-icon-button (click)="openDialog(a)">
                        <mat-icon>mode_edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="borrarAlumno(a.id_alumno)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
    <mat-paginator #paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]"></mat-paginator>
</div>

<ng-template #alumnoDialog>
    <h3 mat-dialog-title>{{ isEdit ? 'Editar' : 'Nuevo' }} Alumno</h3>

    <form [formGroup]="alumnoForm" (ngSubmit)="confirmSave()">
        <div mat-dialog-content>
            <div class="row">
                <mat-form-field color="accent" class="col-md-4">
                    <input matInput placeholder="NIF/NIE" formControlName="nif_nie" maxlength="9">
                </mat-form-field>
                <mat-form-field color="accent" class="col-md-4">
                    <input matInput placeholder="Nombre" formControlName="nombre">
                </mat-form-field>
                <mat-form-field color="accent" class="col-md-4">
                    <input matInput placeholder="Apellidos" formControlName="apellidos">
                </mat-form-field>
            </div>

            <div class="row">
                <mat-form-field class="col-md-6">
                    <mat-label>Centro Educativo</mat-label>
                    <mat-select formControlName="id_entidad">
                        <mat-option *ngFor="let ent of entidades" [value]="ent.id_entidad">
                            {{ent.entidad}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field class="col-md-6">
                    <mat-label>Ciclo Formativo</mat-label>
                    <mat-select formControlName="id_ciclo">
                        <mat-option *ngFor="let c of ciclos" [value]="c.id_ciclo">
                            {{c.ciclo}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="row">
                <mat-form-field class="col-md-4">
                    <mat-label>Curso</mat-label>
                    <mat-select formControlName="curso">
                        <mat-option [value]="1">1º</mat-option>
                        <mat-option [value]="2">2º</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field color="accent" class="col-md-4">
                    <mat-label>Fecha de Nacimiento</mat-label>
                    <input matInput type="date" formControlName="fecha_nacimiento">
                </mat-form-field>
                <mat-form-field color="accent" class="col-md-4">
                    <input matInput placeholder="Teléfono" formControlName="telefono">
                </mat-form-field>
            </div>

            <div class="row">
                <mat-form-field color="accent" class="col-md-12">
                    <input matInput placeholder="Dirección" formControlName="direccion">
                </mat-form-field>
            </div>

            <div class="row">
                <mat-form-field color="accent" class="col-md-8">
                    <input matInput placeholder="Localidad" formControlName="localidad">
                </mat-form-field>
                <mat-form-field color="accent" class="col-md-4">
                    <input matInput placeholder="Código Postal" formControlName="cp" maxlength="5">
                </mat-form-field>
            </div>

            <div class="row">
                <mat-form-field color="accent" class="col-md-12">
                    <textarea matInput placeholder="Observaciones" formControlName="observaciones"></textarea>
                </mat-form-field>
            </div>
        </div>

        <div mat-dialog-actions align="end">
            <button mat-button type="button" (click)="dialog.closeAll()">Cancelar</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="!alumnoForm.valid">Guardar</button>
        </div>
    </form>
</ng-template>
